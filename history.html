<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#020a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hydro — Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020a14;
  --surface: #040f1e;
  --surface2: #061528;
  --border: #0d2240;
  --border2: #102a50;
  --accent: #0066ff;
  --accent2: #004acc;
  --glow: rgba(0,102,255,0.15);
  --glow2: rgba(0,102,255,0.06);
  --text: #e8f4ff;
  --text2: #5a8ab8;
  --text3: #2a4a6a;
  --done: #00c87a;
  --done-bg: #00140d;
  --done-border: #004d2a;
  --late: #ff5500;
  --mono: 'DM Mono', monospace;
  --sans: 'Syne', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100dvh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,102,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,102,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  max-width: 430px;
  margin: 0 auto;
  padding: 0 0 48px;
  min-height: 100dvh;
}

.header {
  padding: 52px 24px 24px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.h-brand {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  font-family: var(--mono);
  color: #0a2a5a;
  background: #e8f4ff;
  padding: 3px 8px;
  border-radius: 4px;
  display: inline-block;
  margin-bottom: 8px;
}

.h-title { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }

.back-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--text2);
  font-family: var(--mono);
  font-size: 11px;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: all 0.15s;
  margin-top: 4px;
  text-decoration: none;
  display: inline-block;
}
.back-btn:hover { border-color: var(--accent); color: var(--text); }

/* POINTS */
.points-card {
  background: linear-gradient(135deg, #0a1e3a 0%, #061228 100%);
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 24px 24px;
}

.points-label { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
.points-val { font-size: 42px; font-weight: 800; color: var(--text); letter-spacing: -0.03em; line-height: 1; }
.points-unit { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 4px; letter-spacing: 0.08em; }
.points-badge { font-size: 52px; line-height: 1; }

/* FILTER */
.filter-bar {
  margin: 0 24px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.filter-nav {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 14px;
  color: var(--text2);
  font-family: var(--mono);
  font-size: 18px;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
  line-height: 1;
}
.filter-nav:hover { border-color: var(--accent); color: var(--text); }

.filter-label {
  flex: 1;
  text-align: center;
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  padding: 8px 0;
}

.filter-selectors {
  margin: 0 24px 16px;
  display: none;
  gap: 8px;
}
.filter-selectors.open { display: flex; }

select {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  outline: none;
  cursor: pointer;
}
select:focus { border-color: var(--accent); }

/* SUMMARY */
.month-summary {
  margin: 0 24px 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.sum-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 10px;
  text-align: center;
}

.sum-val { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; line-height: 1; }
.sum-val.blue { color: var(--accent); }
.sum-val.green { color: var(--done); }
.sum-lbl { font-family: var(--mono); font-size: 9px; color: var(--text3); margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase; }

/* SECTION LABEL */
.section-label {
  padding: 0 24px;
  margin-bottom: 12px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* CALENDAR */
.month-cal { margin: 0 24px 24px; }

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 6px;
}
.cal-weekday { font-family: var(--mono); font-size: 9px; color: var(--text3); text-align: center; letter-spacing: 0.06em; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.cal-cell {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border: 1.5px solid transparent;
  transition: all 0.2s;
}

.cal-cell.empty-cell { background: transparent; border-color: transparent; }
.cal-cell.no-data { background: var(--surface); border-color: var(--border); }
.cal-cell.full { background: rgba(0,200,122,0.1); border-color: var(--done-border); }
.cal-cell.partial { background: rgba(0,102,255,0.08); border-color: var(--border2); }
.cal-cell.zero { background: rgba(255,85,0,0.06); border-color: #5a1a00; }
.cal-cell.today-cell { box-shadow: 0 0 0 2px var(--accent); }
.cal-cell.future-cell { opacity: 0.25; background: var(--surface); border-color: var(--border); }

.cal-day-num { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--text2); line-height: 1; }
.cal-cell.full .cal-day-num { color: var(--done); }
.cal-cell.partial .cal-day-num { color: #6ab0ff; }
.cal-cell.zero .cal-day-num { color: var(--late); }
.cal-cell.today-cell .cal-day-num { color: var(--text); font-weight: 700; }

.cal-day-pct { font-family: var(--mono); font-size: 8px; color: var(--text3); line-height: 1; }
.cal-cell.full .cal-day-pct { color: rgba(0,200,122,0.6); }
.cal-cell.partial .cal-day-pct { color: rgba(0,102,255,0.5); }
.cal-cell.zero .cal-day-pct { color: rgba(255,85,0,0.5); }

/* DAY CARDS */
.day-cards { padding: 0 24px; display: flex; flex-direction: column; gap: 8px; }

.day-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.day-card.full { border-color: var(--done-border); background: var(--done-bg); }
.day-card.today-card { border-color: var(--border2); background: var(--glow2); }

.day-card-left { flex: 1; }
.day-card-date { font-family: var(--mono); font-size: 12px; color: var(--text2); letter-spacing: 0.06em; margin-bottom: 4px; }
.day-card-info { font-family: var(--mono); font-size: 10px; color: var(--text3); margin-bottom: 6px; }
.day-card-bar-wrap { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.day-card-bar { height: 100%; border-radius: 2px; }
.day-card-stats { text-align: right; flex-shrink: 0; }
.day-card-pct { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--text); }
.day-card-pts { font-family: var(--mono); font-size: 10px; color: var(--text3); margin-top: 2px; }
.day-card-medal { font-size: 22px; flex-shrink: 0; }

/* EMPTY */
.empty-state { text-align: center; padding: 40px 24px; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-family: var(--mono); font-size: 12px; color: var(--text3); letter-spacing: 0.08em; line-height: 1.8; }

/* DAY DETAIL MODAL */
.day-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(2,10,20,0.88);
  backdrop-filter: blur(4px);
  z-index: 500;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.day-modal-overlay.show { opacity: 1; pointer-events: all; }

.day-modal-box {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px 20px 0 0;
  padding: 24px 24px 40px;
  width: 100%;
  max-width: 430px;
  transform: translateY(40px);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.day-modal-overlay.show .day-modal-box { transform: translateY(0); }

.day-modal-handle {
  width: 36px; height: 3px;
  background: var(--border2);
  border-radius: 2px;
  margin: 0 auto 20px;
}

.day-modal-date {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.day-modal-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.day-modal-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.day-modal-stat {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 8px;
  text-align: center;
}

.day-modal-stat-val {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1;
}
.day-modal-stat-val.blue { color: var(--accent); }
.day-modal-stat-val.green { color: var(--done); }

.day-modal-stat-lbl {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text3);
  margin-top: 4px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.day-modal-bar-wrap {
  height: 4px;
  background: var(--surface2);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 20px;
}
.day-modal-bar { height: 100%; border-radius: 2px; transition: width 0.6s ease; }

.day-modal-close {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  color: var(--text3);
  font-family: var(--mono);
  font-size: 12px;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: border-color 0.15s;
}
.day-modal-close:hover { border-color: var(--border2); color: var(--text2); }

.cal-cell:not(.empty-cell):not(.future-cell) { cursor: pointer; }
.cal-cell:not(.empty-cell):not(.future-cell):active { transform: scale(0.92); }
.medal-overlay {
  position: fixed; inset: 0;
  background: rgba(2,10,20,0.92);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.medal-overlay.show { opacity: 1; pointer-events: all; }

.medal-box { text-align: center; position: relative; z-index: 1001; }

@keyframes medalPop {
  0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.medal-icon {
  font-size: 96px; display: block; margin-bottom: 16px;
  filter: drop-shadow(0 0 24px rgba(255,200,0,0.6));
  animation: medalFloat 2s ease-in-out infinite;
}

@keyframes medalFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.medal-title { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
.medal-sub { font-family: var(--mono); font-size: 13px; color: var(--text2); margin-bottom: 8px; }
.medal-pts { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--accent); margin-bottom: 24px; }
.medal-close { background: var(--accent); border: none; border-radius: 12px; padding: 12px 32px; color: #fff; font-family: var(--sans); font-size: 15px; font-weight: 700; cursor: pointer; }

.particle { position: fixed; pointer-events: none; z-index: 999; font-size: 20px; animation: particleFly 1.5s ease-out forwards; }
@keyframes particleFly {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-200px) scale(0.3); opacity: 0; }
}
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <div>
      <div class="h-brand">IASolution</div>
      <div class="h-title">Stats 📊</div>
    </div>
    <a class="back-btn" href="index.html">← voltar</a>
  </div>

  <div class="points-card">
    <div>
      <div class="points-label">pontos totais</div>
      <div class="points-val" id="pts-val">0</div>
      <div class="points-unit">hydro points</div>
    </div>
    <div class="points-badge" id="pts-badge">💧</div>
  </div>

  <div class="filter-bar">
    <button class="filter-nav" onclick="prevMonth()">‹</button>
    <div class="filter-label" id="filter-label" onclick="toggleSelectors()">—</div>
    <button class="filter-nav" onclick="nextMonth()">›</button>
  </div>

  <div class="filter-selectors" id="filter-selectors">
    <select id="sel-month" onchange="onFilterChange()"></select>
    <select id="sel-year" onchange="onFilterChange()"></select>
  </div>

  <div class="month-summary">
    <div class="sum-card">
      <div class="sum-val green" id="sum-dias">0</div>
      <div class="sum-lbl">dias completos</div>
    </div>
    <div class="sum-card">
      <div class="sum-val blue" id="sum-pct">0%</div>
      <div class="sum-lbl">média mensal</div>
    </div>
    <div class="sum-card">
      <div class="sum-val" id="sum-pts">0</div>
      <div class="sum-lbl">pts do mês</div>
    </div>
  </div>

  <div class="section-label">calendário</div>
  <div class="month-cal">
    <div class="cal-weekdays">
      <div class="cal-weekday">D</div>
      <div class="cal-weekday">S</div>
      <div class="cal-weekday">T</div>
      <div class="cal-weekday">Q</div>
      <div class="cal-weekday">Q</div>
      <div class="cal-weekday">S</div>
      <div class="cal-weekday">S</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="section-label">detalhe por dia</div>
  <div class="day-cards" id="day-cards"></div>
</div>

<div class="day-modal-overlay" id="day-modal" onclick="closeDayModal(event)">
  <div class="day-modal-box">
    <div class="day-modal-handle"></div>
    <div class="day-modal-date" id="dm-date">—</div>
    <div class="day-modal-title">
      <span id="dm-title">—</span>
      <span id="dm-medal"></span>
    </div>
    <div class="day-modal-stats">
      <div class="day-modal-stat">
        <div class="day-modal-stat-val blue" id="dm-garrafas">—</div>
        <div class="day-modal-stat-lbl">garrafas</div>
      </div>
      <div class="day-modal-stat">
        <div class="day-modal-stat-val" id="dm-ml">—</div>
        <div class="day-modal-stat-lbl">ml bebidos</div>
      </div>
      <div class="day-modal-stat">
        <div class="day-modal-stat-val green" id="dm-pts">—</div>
        <div class="day-modal-stat-lbl">pontos</div>
      </div>
    </div>
    <div class="day-modal-bar-wrap">
      <div class="day-modal-bar" id="dm-bar"></div>
    </div>
    <button class="day-modal-close" onclick="closeDayModal()">fechar</button>
  </div>
</div>



<script>
const STORE_KEY = 'hydro_v2';

function loadState() {
  try { const r = localStorage.getItem(STORE_KEY); if (r) return JSON.parse(r); } catch(e) {}
  return null;
}

function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

let state = loadState() || {
  config: { inicio: '07:30', fim: '23:00', meta: 4000, garrafa: 750 },
  profile: { nome: '', peso: 70 },
  checks: {}, lastDay: null, history: {}, points: 0, medals: {}
};

if (!state.history) state.history = {};
if (!state.profile) state.profile = { nome: '', peso: 70 };
if (state.points === undefined) state.points = 0;
if (!state.medals) state.medals = {};

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth();

function todayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function getDayData(dateStr) {
  const today = todayStr();
  if (dateStr === today) {
    const n = Math.ceil(state.config.meta / state.config.garrafa);
    const done = Object.values(state.checks).filter(Boolean).length;
    return { done, total: n, ml: done * state.config.garrafa, meta: state.config.meta, isToday: true, isFuture: false };
  }
  const h = state.history[dateStr];
  if (!h) {
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const tod = new Date(); tod.setHours(0,0,0,0);
    return { done: 0, total: 0, ml: 0, meta: state.config.meta, isToday: false, isFuture: dt > tod };
  }
  const done = Object.values(h.checks).filter(Boolean).length;
  return { done, total: h.totalSlots, ml: done * h.garrafa, meta: h.meta || (h.totalSlots * h.garrafa), isToday: false, isFuture: false };
}

function getPct(data) {
  if (!data.total || data.isFuture) return 0;
  return Math.min(100, Math.round((data.ml / data.meta) * 100));
}

function getDailyMedal(pct) {
  if (pct >= 100) return { icon: '🥇', label: 'Ouro', pts: 50 };
  if (pct >= 75)  return { icon: '🥈', label: 'Prata', pts: 20 };
  if (pct >= 50)  return { icon: '🥉', label: 'Bronze', pts: 10 };
  return null;
}

function prevMonth() {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render();
}

function nextMonth() {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render();
}

function toggleSelectors() {
  document.getElementById('filter-selectors').classList.toggle('open');
}

function onFilterChange() {
  viewMonth = parseInt(document.getElementById('sel-month').value);
  viewYear  = parseInt(document.getElementById('sel-year').value);
  document.getElementById('filter-selectors').classList.remove('open');
  render();
}

function buildSelectors() {
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('sel-month').innerHTML = months.map((m,i) =>
    `<option value="${i}" ${i===viewMonth?'selected':''}>${m}</option>`).join('');
  let yHTML = '';
  for (let y = now.getFullYear(); y >= now.getFullYear()-5; y--) {
    yHTML += `<option value="${y}" ${y===viewYear?'selected':''}>${y}</option>`;
  }
  document.getElementById('sel-year').innerHTML = yHTML;
}



function openDayModal(d) {
  const ds = viewYear+'-'+(viewMonth+1)+'-'+d;
  const data = getDayData(ds);
  const pct = getPct(data);
  const medal = getDailyMedal(pct);
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const weekDays = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const dt = new Date(viewYear, viewMonth, d);
  const dd = d < 10 ? '0'+d : d;
  const mm = viewMonth+1 < 10 ? '0'+(viewMonth+1) : viewMonth+1;
  const barColor = pct >= 100 ? 'var(--done)' : pct >= 50 ? 'var(--accent)' : 'var(--late)';

  document.getElementById('dm-date').textContent = weekDays[dt.getDay()] + ', ' + dd + '/' + mm + '/' + viewYear;
  document.getElementById('dm-title').textContent = data.total ? pct + '% da meta' : 'sem dados';
  document.getElementById('dm-medal').textContent = medal ? medal.icon : (data.total ? '💧' : '');
  document.getElementById('dm-garrafas').textContent = data.total ? data.done + '/' + data.total : '—';
  document.getElementById('dm-ml').textContent = data.total ? data.ml.toLocaleString('pt-BR') : '—';
  document.getElementById('dm-pts').textContent = medal ? '+' + medal.pts : '0';
  document.getElementById('dm-bar').style.width = pct + '%';
  document.getElementById('dm-bar').style.background = barColor;

  document.getElementById('day-modal').classList.add('show');
}

function closeDayModal(e) {
  if (e && e.target !== document.getElementById('day-modal')) return;
  document.getElementById('day-modal').classList.remove('show');
}

function render() {
  const today = todayStr();
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const weekDays = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  document.getElementById('filter-label').textContent = monthNames[viewMonth] + ' ' + viewYear;
  buildSelectors();

  // Points
  const pts = state.points || 0;
  document.getElementById('pts-val').textContent = pts.toLocaleString('pt-BR');
  let badge = '💧';
  if (pts >= 2000) badge = '💎';
  else if (pts >= 1000) badge = '🥇';
  else if (pts >= 500) badge = '🥈';
  else if (pts >= 100) badge = '🥉';
  document.getElementById('pts-badge').textContent = badge;

  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();

  // Cache day data
  const cache = {};
  let fullDaysCount = 0, totalPct = 0, activeDays = 0, monthPts = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = viewYear+'-'+(viewMonth+1)+'-'+d;
    const data = getDayData(ds);
    const pct = getPct(data);
    cache[d] = { data, pct, ds };
    if (!data.isFuture && data.total) {
      activeDays++;
      totalPct += pct;
      if (pct >= 100) fullDaysCount++;
      const m = getDailyMedal(pct);
      if (m) monthPts += m.pts;
    }
  }

  const avgPct = activeDays ? Math.round(totalPct / activeDays) : 0;
  document.getElementById('sum-dias').textContent = fullDaysCount;
  document.getElementById('sum-pct').textContent = avgPct + '%';
  document.getElementById('sum-pts').textContent = monthPts;

  // Calendar
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  for (let i = 0; i < firstDow; i++) {
    const e = document.createElement('div');
    e.className = 'cal-cell empty-cell';
    grid.appendChild(e);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const { data, pct, ds } = cache[d];
    const isToday = ds === today;
    let cls = 'cal-cell';
    if (data.isFuture) cls += ' future-cell';
    else if (!data.total) cls += ' no-data';
    else if (pct >= 100) cls += ' full';
    else if (pct > 0) cls += ' partial';
    else cls += ' zero';
    if (isToday) cls += ' today-cell';
    const cell = document.createElement('div');
    cell.className = cls;
    cell.innerHTML = `<div class="cal-day-num">${d}</div><div class="cal-day-pct">${data.total && !data.isFuture ? pct+'%' : ''}</div>`;
    if (!data.isFuture) cell.onclick = () => openDayModal(d);
    grid.appendChild(cell);
  }

  // Day cards — last 7 days with data only
  const cards = document.getElementById('day-cards');
  cards.innerHTML = '';
  const daysWithData = [];
  for (let d = daysInMonth; d >= 1; d--) {
    const { data, pct, ds } = cache[d];
    if (data.isFuture || !data.total) continue;
    daysWithData.push({ d, ds, data, pct });
    if (daysWithData.length >= 7) break;
  }

  if (daysWithData.length === 0) {
    cards.innerHTML = `<div class="empty-state"><div class="empty-icon">💧</div><div class="empty-text">nenhum dado para<br>${monthNames[viewMonth]} ${viewYear}</div></div>`;
  } else {
    daysWithData.forEach(({ d, ds, data, pct }) => {
      const medal = getDailyMedal(pct);
      const isToday = ds === today;
      const barColor = pct >= 100 ? 'var(--done)' : pct >= 50 ? 'var(--accent)' : 'var(--late)';
      let cardClass = 'day-card';
      if (pct >= 100) cardClass += ' full';
      if (isToday) cardClass += ' today-card';
      const dt = new Date(viewYear, viewMonth, d);
      const wday = weekDays[dt.getDay()];
      const dd = d < 10 ? '0'+d : d;
      const mm = viewMonth+1 < 10 ? '0'+(viewMonth+1) : viewMonth+1;
      const card = document.createElement('div');
      card.className = cardClass;
      card.innerHTML = `
        <div class="day-card-left">
          <div class="day-card-date">${wday}, ${dd}/${mm}${isToday ? ' · hoje' : ''}</div>
          <div class="day-card-info">${data.done}/${data.total} garrafas · ${data.ml.toLocaleString('pt-BR')} ml</div>
          <div class="day-card-bar-wrap"><div class="day-card-bar" style="width:${pct}%;background:${barColor};"></div></div>
        </div>
        <div class="day-card-stats">
          <div class="day-card-pct">${pct}%</div>
          <div class="day-card-pts">${medal ? '+'+medal.pts+' pts' : '0 pts'}</div>
        </div>
        <div class="day-card-medal">${medal ? medal.icon : '💧'}</div>
      `;
      cards.appendChild(card);
    });
  }

  }

render();
</script>
</body>
</html>
